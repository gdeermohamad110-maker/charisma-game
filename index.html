<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لعبة كاريزما</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body {
            background-color: #121212;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #game-ui {
            margin: 6px 0;
            display: flex;
            gap: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            background: #1e1e1e;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        canvas {
            background-color: #1a1614;
            border: 2px solid #d32f2f;
            width: 95vw;
            max-width: 380px;
            height: 270px;
            border-radius: 6px;
        }
        #controls {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 400px;
            padding: 10px;
            background: #1e1e1e;
            margin-top: 8px;
            border-top: 1px solid #444;
            align-items: center;
        }
        #joystick-container {
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }
        #joystick-stick {
            width: 35px;
            height: 35px;
            background: #ff9800;
            border-radius: 50%;
            position: absolute;
        }
        .action-pad {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }
        #shoot-btn {
            width: 70px;
            height: 70px;
            background-color: #f44336;
            border-radius: 50%;
            font-size: 0.85rem;
            font-weight: bold;
            border: none;
            color: white;
        }
        #shoot-btn:active { background-color: #d32f2f; transform: scale(0.95); }
        #weapon-btn {
            background-color: #9c27b0;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="game-ui">
        <div>البطل: <span style="color: #ffb74d;">كاريزما 😎</span></div>
        <div>نقاط: <span id="score" style="color: #4caf50;">0</span></div>
        <div>أعلى: <span id="highscore" style="color: #ffeb3b;">0</span></div>
        <div>صحة: <span id="health" style="color: #f44336;">150</span></div>
        <div>مرحلة: <span id="wave" style="color: #ff9800;">1</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="280"></canvas>

    <div id="controls">
        <div id="joystick-container">
            <div id="joystick-stick"></div>
        </div>
        <div class="action-pad">
            <button id="weapon-btn">السلاح: <span id="weapon-name">عادي</span> 🔄</button>
            <button id="shoot-btn">إطلاق 🎯</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let highscore = localStorage.getItem('charisma_highscore') || 0;
        document.getElementById('highscore').innerText = highscore;

        let health = 150;
        let wave = 1;
        let enemiesKilled = 0;
        let gameOver = false;
        let screenShake = 0;

        const weapons = [
            { name: "عادي", color: "#ffeb3b", speed: 9, radius: 4, damage: 1 },
            { name: "سريع ⚡", color: "#00bcd4", speed: 13, radius: 3, damage: 1 },
            { name: "مدمر 🔥", color: "#ff5722", speed: 6, radius: 8, damage: 3 }
        ];
        let currentWeapon = 0;

        const player = {
            x: 200, y: 140, radius: 16, color: '#1565c0', speed: 3.5, angle: 0
        };

        const bullets = [];
        const enemies = [];
        const powerups = [];

        // تحكم الجويستيك
        const joystickContainer = document.getElementById('joystick-container');
        const joystickStick = document.getElementById('joystick-stick');
        let moveVector = { x: 0, y: 0 };

        function handleMove(touchX, touchY) {
            const rect = joystickContainer.getBoundingClientRect();
            let dx = touchX - (rect.left + rect.width / 2);
            let dy = touchY - (rect.top + rect.height / 2);
            let dist = Math.hypot(dx, dy);
            let maxR = rect.width / 2;

            if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
            joystickStick.style.transform = `translate(${dx}px, ${dy}px)`;
            moveVector = { x: dx / maxR, y: dy / maxR };
            if (dist > 5) player.angle = Math.atan2(dy, dx);
        }

        joystickContainer.addEventListener('touchstart', (e) => handleMove(e.touches[0].clientX, e.touches[0].clientY));
        joystickContainer.addEventListener('touchmove', (e) => handleMove(e.touches[0].clientX, e.touches[0].clientY));
        joystickContainer.addEventListener('touchend', () => {
            joystickStick.style.transform = 'translate(0,0)';
            moveVector = { x: 0, y: 0 };
        });

        document.getElementById('weapon-btn').addEventListener('click', () => {
            currentWeapon = (currentWeapon + 1) % weapons.length;
            document.getElementById('weapon-name').innerText = weapons[currentWeapon].name;
        });

        document.getElementById('shoot-btn').addEventListener('click', shoot);
        document.getElementById('shoot-btn').addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });

        function shoot() {
            if (gameOver) return;
            const w = weapons[currentWeapon];
            bullets.push({
                x: player.x, y: player.y,
                dx: Math.cos(player.angle) * w.speed,
                dy: Math.sin(player.angle) * w.speed,
                radius: w.radius, color: w.color, damage: w.damage
            });
        }

        function spawnEnemy() {
            if (gameOver) return;
            let isBoss = enemiesKilled > 0 && enemiesKilled % 5 === 0;
            enemies.push({
                x: Math.random() < 0.5 ? -20 : canvas.width + 20,
                y: Math.random() * canvas.height,
                radius: isBoss ? 24 : 12,
                color: isBoss ? '#616161' : '#b71c1c',
                speed: isBoss ? 1 : 1.5 + (wave * 0.1),
                hp: isBoss ? 5 + wave : 1,
                isBoss: isBoss
            });
            setTimeout(spawnEnemy, Math.max(700, 1800 - wave * 100));
        }

        function update() {
            if (gameOver) return;

            if (screenShake > 0) screenShake--;

            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x + moveVector.x * player.speed));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y + moveVector.y * player.speed));

            bullets.forEach((b, bi) => {
                b.x += b.dx; b.y += b.dy;
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(bi, 1);
            });

            powerups.forEach((p, pi) => {
                if (Math.hypot(player.x - p.x, player.y - p.y) < player.radius + p.radius) {
                    health = Math.min(150, health + 40);
                    document.getElementById('health').innerText = health;
                    powerups.splice(pi, 1);
                }
            });

            enemies.forEach((e, ei) => {
                let angle = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angle) * e.speed;
                e.y += Math.sin(angle) * e.speed;

                if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius + e.radius) {
                    health -= e.isBoss ? 25 : 10;
                    document.getElementById('health').innerText = Math.max(0, health);
                    screenShake = 10;
                    enemies.splice(ei, 1);
                    if (health <= 0) {
                        gameOver = true;
                        if (score > highscore) localStorage.setItem('charisma_highscore', score);
                        alert('انتهت اللعبة يا غدير! نقاطك: ' + score);
                        location.reload();
                    }
                }

                bullets.forEach((b, bi) => {
                    if (Math.hypot(b.x - e.x, b.y - e.y) < b.radius + e.radius) {
                        e.hp -= b.damage;
                        bullets.splice(bi, 1);
                        if (e.hp <= 0) {
                            if (Math.random() < 0.25) powerups.push({ x: e.x, y: e.y, radius: 10 });
                            enemies.splice(ei, 1);
                            score += e.isBoss ? 40 : 10;
                            enemiesKilled++;
                            document.getElementById('score').innerText = score;
                            if (enemiesKilled >= 8) {
                                wave++;
                                enemiesKilled = 0;
                                document.getElementById('wave').innerText = wave;
                            }
                        }
                    }
                });
            });
        }

        function draw() {
            ctx.save();
            if (screenShake > 0) ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // صناديق الصحة
            powerups.forEach(p => {
                ctx.fillStyle = '#4caf50';
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.fillText('✚', p.x - 4, p.y + 4);
            });

            // الطلقات
            bullets.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill();
            });

            // الأعداء
            enemies.forEach(e => {
                ctx.fillStyle = e.color;
                ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fill();
            });

            // البطل كاريزما
            ctx.fillStyle = player.color;
            ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2); ctx.fill();
            
            // وجه البطل
            ctx.fillStyle = '#ffcc80';
            ctx.beginPath(); ctx.arc(player.x, player.y, player.radius * 0.6, 0, Math.PI * 2); ctx.fill();

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        spawnEnemy();
        loop();
    </script>
</body>
</html>
