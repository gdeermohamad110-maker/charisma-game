<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لعبة غدير - الكابتن والأسلحة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body {
            background-color: #121212;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #game-ui {
            margin: 4px 0;
            display: flex;
            gap: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            background: #1e1e1e;
            padding: 5px 8px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        canvas {
            background-color: #1a1a1a;
            border: 2px solid #ff9800;
            width: 96vw;
            max-width: 380px;
            height: 270px;
            border-radius: 6px;
        }
        #controls {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 400px;
            padding: 8px 10px;
            background: #1e1e1e;
            margin-top: 6px;
            border-top: 1px solid #444;
            align-items: center;
        }
        .d-pad {
            display: grid;
            grid-template-columns: 45px 45px 45px;
            grid-template-rows: 45px 45px;
            gap: 3px;
        }
        .ctrl-btn {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            font-size: 1.1rem;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .ctrl-btn:active { background-color: #ff9800; }
        
        #up { grid-column: 2; grid-row: 1; }
        #left { grid-column: 1; grid-row: 2; }
        #right { grid-column: 3; grid-row: 2; }
        #down { grid-column: 2; grid-row: 2; }

        .action-pad {
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: center;
        }
        #shoot-btn {
            width: 70px;
            height: 70px;
            background-color: #f44336;
            border-radius: 50%;
            font-size: 0.85rem;
            font-weight: bold;
            border: none;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #shoot-btn:active { background-color: #d32f2f; transform: scale(0.95); }
        
        #weapon-btn {
            background-color: #9c27b0;
            color: white;
            border: none;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="game-ui">
        <div>البطل: <span style="color: #ffb74d;">غدير 💀</span></div>
        <div>نقاط: <span id="score" style="color: #4caf50;">0</span></div>
        <div>صحة: <span id="health" style="color: #f44336;">150</span></div>
        <div>مرحلة: <span id="wave" style="color: #ff9800;">1</span></div>
        <div>السلاح: <span id="weapon-name" style="color: #ab47bc;">بندقية قتالية</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="280"></canvas>

    <div id="controls">
        <div class="d-pad">
            <button class="ctrl-btn" id="up">⬆️</button>
            <button class="ctrl-btn" id="left">⬅️</button>
            <button class="ctrl-btn" id="down">⬇️</button>
            <button class="ctrl-btn" id="right">➡️</button>
        </div>
        <div class="action-pad">
            <button id="weapon-btn">تغيير السلاح 🔄</button>
            <button id="shoot-btn">إطلاق النار 🎯</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const healthEl = document.getElementById('health');
        const waveEl = document.getElementById('wave');
        const weaponNameEl = document.getElementById('weapon-name');

        let score = 0;
        let health = 150;
        let wave = 1;
        let enemiesKilledInWave = 0;
        let gameOver = false;

        const weapons = [
            { name: "بندقية قتالية", color: "#ffeb3b", speed: 9, radius: 4, damage: 1 },
            { name: "رشاش سريع ⚡", color: "#00bcd4", speed: 13, radius: 3, damage: 1 },
            { name: "قاذف مدمر 🔥", color: "#ff5722", speed: 7, radius: 8, damage: 3 }
        ];
        let currentWeaponIndex = 0;

        // البطل (غدير)
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 20,
            color: '#3f51b5', // لون ملابسك كبطل
            faceColor: '#ffcc80', // لون وجهك
            speed: 3.5,
            angle: 0 // زاوية اتجاه السلاح والبطل
        };

        const bullets = [];
        const enemies = [];
        const moveState = { up: false, down: false, left: false, right: false };

        function bindTouch(id, stateKey) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); moveState[stateKey] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); moveState[stateKey] = false; });
            btn.addEventListener('mousedown', () => moveState[stateKey] = true);
            btn.addEventListener('mouseup', () => moveState[stateKey] = false);
        }

        bindTouch('up', 'up');
        bindTouch('down', 'down');
        bindTouch('left', 'left');
        bindTouch('right', 'right');

        document.getElementById('weapon-btn').addEventListener('click', () => {
            currentWeaponIndex = (currentWeaponIndex + 1) % weapons.length;
            weaponNameEl.innerText = weapons[currentWeaponIndex].name;
        });

        const shootBtn = document.getElementById('shoot-btn');
        shootBtn.addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
        shootBtn.addEventListener('mousedown', () => shoot());

        function shoot() {
            if (gameOver) return;
            const w = weapons[currentWeaponIndex];
            // إطلاق الطلقة باتجاه الزاوية التي يوجهها البطل
            bullets.push({
                x: player.x + Math.cos(player.angle) * 20,
                y: player.y + Math.sin(player.angle) * 20,
                dx: Math.cos(player.angle) * w.speed,
                dy: Math.sin(player.angle) * w.speed,
                radius: w.radius,
                color: w.color,
                damage: w.damage
            });
        }

        function spawnEnemy() {
            if (gameOver) return;
            let isBoss = (enemiesKilledInWave > 0 && enemiesKilledInWave % 5 === 0);
            
            let x, y;
            if (Math.random() < 0.5) {
                x = Math.random() < 0.5 ? -30 : canvas.width + 30;
                y = Math.random() * canvas.height;
            } else {
                x = Math.random() * canvas.width;
                y = Math.random() < 0.5 ? -30 : canvas.height + 30;
            }

            enemies.push({
                x: x,
                y: y,
                radius: isBoss ? 28 : 13,
                color: isBoss ? '#9c27b0' : '#e91e63',
                speed: isBoss ? 0.8 + (wave * 0.1) : 1.4 + (wave * 0.15),
                hp: isBoss ? 5 + wave : 1,
                maxHp: isBoss ? 5 + wave : 1,
                isBoss: isBoss
            });

            let nextTime = Math.max(600, 1900 - (wave * 150));
            setTimeout(spawnEnemy, nextTime);
        }

        function update() {
            if (gameOver) return;

            // حركة البطل والتحكم بالاتجاهات
            let moveX = 0;
            let moveY = 0;
            if (moveState.up) { moveY = -1; player.angle = -Math.PI / 2; }
            if (moveState.down) { moveY = 1; player.angle = Math.PI / 2; }
            if (moveState.left) { moveX = -1; player.angle = Math.PI; }
            if (moveState.right) { moveX = 1; player.angle = 0; }

            // دعم الحركة القطرية (الزوايا)
            if (moveState.up && moveState.right) player.angle = -Math.PI / 4;
            if (moveState.up && moveState.left) player.angle = -3 * Math.PI / 4;
            if (moveState.down && moveState.right) player.angle = Math.PI / 4;
            if (moveState.down && moveState.left) player.angle = 3 * Math.PI / 4;

            if (moveX !== 0 || moveY !== 0) {
                player.x += moveX * player.speed;
                player.y += moveY * player.speed;
            }

            // منع البطل من الخروج عن حدود الشاشة
            if (player.x < player.radius) player.x = player.radius;
            if (player.x > canvas.width - player.radius) player.x = canvas.width - player.radius;
            if (player.y < player.radius) player.y = player.radius;
            if (player.y > canvas.height - player.radius) player.y = canvas.height - player.radius;

            // تحديث الطلقات
            bullets.forEach((b, index) => {
                b.x += b.dx;
                b.y += b.dy;
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(index, 1);
                }
            });

            // تحديث الأعداء
            enemies.forEach((e, eIndex) => {
                const angleToPlayer = Math.atan2(player.y - e.y, player.x - e.x);
                e.x += Math.cos(angleToPlayer) * e.speed;
                e.y += Math.sin(angleToPlayer) * e.speed;

                // الاصطدام بالبطل (غدير)
                const distPlayer = Math.hypot(player.x - e.x, player.y - e.y);
                if (distPlayer < player.radius + e.radius) {
                    health -= e.isBoss ? 25 : 10;
                    healthEl.innerText = Math.max(0, health);
                    enemies.splice(eIndex, 1);
                    if (health <= 0) {
                        gameOver = true;
                        alert('لقد انتهت المعركة يا غدير! مجموع النقاط: ' + score);
                        location.reload();
                    }
                }

                // إصابة الأعداء بالرصاص
                bullets.forEach((b, bIndex) => {
                    const distBullet = Math.hypot(b.x - e.x, b.y - e.y);
                    if (distBullet < b.radius + e.radius) {
                        e.hp -= b.damage;
                        bullets.splice(bIndex, 1);
                        
                        if (e.hp <= 0) {
                            enemies.splice(eIndex, 1);
                            score += e.isBoss ? 40 : 10;
                            scoreEl.innerText = score;
                            enemiesKilledInWave++;

                            if (enemiesKilledInWave >= 7) {
                                wave++;
                                enemiesKilledInWave = 0;
                                waveEl.innerText = wave;
                                alert('دخلتِ يا غدير المرحلة رقم ' + wave + ' بقوة خارقة! 🚀');
                            }
                        }
                    }
                });
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم الطلقات
            bullets.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // رسم الأعداء
            enemies.forEach(e => {
                ctx.fillStyle = e.color;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fill();

                if (e.isBoss) {
                    ctx.fillStyle = '#000';
                    ctx.fillRect(e.x - 18, e.y - e.radius - 10, 36, 4);
                    ctx.fillStyle = '#4caf50';
                    ctx.fillRect(e.x - 18, e.y - e.radius - 10, (e.hp / e.maxHp) * 36, 4);
                }
            });

            // رسم البطلة (غدير) مع السلاح الممسوك باليد
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);

            // رسم السلاح في اليد يمتد إلى الأمام
            ctx.fillStyle = '#78909c';
            ctx.fillRect(5, 6, 18, 5); // جسم السلاح

            ctx.restore();

            // رسم جسم البطل (دائرة رئيسية)
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();

            // رسم وجه البطل في المنتصف
            ctx.fillStyle = player.faceColor;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius * 0.55, 0, Math.PI * 2);
            ctx.fill();

            // عيون البطل (غدير)
            ctx.fillStyle = '#000';
            ctx.fillRect(player.x - 4, player.y - 3, 3, 3);
            ctx.fillRect(player.x + 2, player.y - 3, 3, 3);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        spawnEnemy();
        gameLoop();
    </script>
</body>
    </html>
